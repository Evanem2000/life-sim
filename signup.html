<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Simulator Signup</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <main>
    <h1>Sign Up for Life Simulator</h1>

    <form id="signup-form">
      <label for="username">Name:</label>
      <input type="text" id="username" name="username" required placeholder="Your Name">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required placeholder="Enter a secure password">

      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
  </main>

  <!-- Auth script -->
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
